<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hi ^_^</title>
    <style>
        /* 全局重置 + 深色未来感背景 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0c10;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(0, 255, 255, 0.05) 0%, transparent 25%),
                radial-gradient(circle at 80% 70%, rgba(255, 0, 255, 0.05) 0%, transparent 30%),
                repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.01) 0px, rgba(255, 255, 255, 0.01) 2px, transparent 2px, transparent 8px);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* 主容器 —— 让所有元素居中并堆叠 */
        .loader-wrapper {
            position: relative;
            width: 320px;
            height: 320px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 脉冲光环背景层 —— 动态波纹 */
        .pulse-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 200, 255, 0.15) 0%, rgba(120, 0, 255, 0.1) 60%, transparent 80%);
            animation: pulse 3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            filter: blur(10px);
        }

        .pulse-ring.delay {
            animation-delay: 1.5s;
            background: radial-gradient(circle, rgba(255, 0, 200, 0.12) 0%, rgba(0, 100, 255, 0.1) 60%, transparent 80%);
        }

        /* 旋转的科技圆环 —— 主视觉 */
        .orbit-ring {
            position: absolute;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            border: 2px solid transparent;
            border-top-color: #00f7ff;
            border-right-color: #a855f7;
            border-bottom-color: #ff4d9d;
            border-left-color: #4dffb8;
            animation: spin 2.2s linear infinite;
            filter: drop-shadow(0 0 8px rgba(0, 255, 255, 0.6)) drop-shadow(0 0 20px rgba(168, 85, 247, 0.4));
            transform: rotate(0deg);
        }

        .orbit-ring::before,
        .orbit-ring::after {
            content: '';
            position: absolute;
            border-radius: 50%;
        }

        /* 第二个圆环：反向旋转 + 虚线风格 */
        .orbit-ring.second {
            width: 150px;
            height: 150px;
            border: 2px dashed rgba(255, 255, 255, 0.5);
            border-top-color: #ff4d9d;
            border-right-color: #4dffb8;
            border-bottom-color: #00f7ff;
            border-left-color: #a855f7;
            animation: spin-reverse 1.6s linear infinite;
            filter: drop-shadow(0 0 6px rgba(255, 77, 157, 0.5));
        }

        /* 第三个小环，快速旋转 */
        .orbit-ring.third {
            width: 100px;
            height: 100px;
            border: 3px solid transparent;
            border-top-color: #f0f;
            border-right-color: #0ff;
            border-bottom-color: #ff0;
            border-left-color: #f0f;
            animation: spin 1s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite;
            filter: drop-shadow(0 0 10px #ff00ff);
        }

        /* 核心文字区域 —— 加载中 + 动态点 */
        .core-text {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            text-shadow: 0 0 15px #00f7ff, 0 0 30px #a855f7, 0 0 45px #ff4d9d;
            font-weight: 600;
            letter-spacing: 4px;
            backdrop-filter: blur(2px);
            animation: flicker 2.8s infinite alternate;
        }

        .core-text .cn {
            font-size: 2rem;
            line-height: 1.4;
            text-transform: uppercase;
            background: linear-gradient(45deg, #ffffff, #c0ffff, #e0b0ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: none;
            filter: drop-shadow(0 0 12px rgba(0, 255, 255, 0.8));
            margin-bottom: 8px;
            white-space: nowrap;
        }

        .core-text .cn span {
            display: inline-block;
            animation: bounce 1.2s infinite alternate;
        }

        /* 字母独立浮动，增加个性 */
        .core-text .cn span:nth-child(1) { animation-delay: 0s; }
        .core-text .cn span:nth-child(2) { animation-delay: 0.15s; }
        .core-text .cn span:nth-child(3) { animation-delay: 0.3s; }
        .core-text .cn span:nth-child(4) { animation-delay: 0.45s; }

        /* 跳动的三个点 */
        .dots {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        .dots div {
            width: 12px;
            height: 12px;
            background: #00f7ff;
            border-radius: 50%;
            box-shadow: 0 0 15px #00f7ff, 0 0 30px #a855f7;
            animation: dotWave 1.4s infinite ease-in-out;
        }

        .dots div:nth-child(1) { animation-delay: 0s; background: #00f7ff; }
        .dots div:nth-child(2) { animation-delay: 0.2s; background: #a855f7; box-shadow: 0 0 15px #a855f7, 0 0 30px #ff4d9d; }
        .dots div:nth-child(3) { animation-delay: 0.4s; background: #ff4d9d; box-shadow: 0 0 15px #ff4d9d, 0 0 30px #00f7ff; }

        /* 四周漂浮的粒子 —— 个性点缀 */
        .particle {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #00f7ff;
            filter: blur(1px);
            box-shadow: 0 0 20px #00f7ff, 0 0 40px #a855f7;
            animation: float 6s infinite alternate ease-in-out;
            opacity: 0.8;
        }

        .particle:nth-child(1) { top: 8%; left: 12%; width: 8px; height: 8px; background: #ff4d9d; animation-duration: 5s; }
        .particle:nth-child(2) { top: 85%; left: 15%; width: 10px; height: 10px; background: #a855f7; animation-duration: 7s; animation-delay: 0.5s; }
        .particle:nth-child(3) { top: 20%; left: 88%; width: 7px; height: 7px; background: #4dffb8; animation-duration: 4.5s; animation-delay: 1s; }
        .particle:nth-child(4) { top: 70%; left: 90%; width: 12px; height: 12px; background: #00f7ff; animation-duration: 8s; animation-delay: 0.2s; }
        .particle:nth-child(5) { top: 45%; left: 5%; width: 5px; height: 5px; background: #ffffff; box-shadow: 0 0 20px #fff; animation-duration: 6.5s; }
        .particle:nth-child(6) { top: 92%; left: 78%; width: 9px; height: 9px; background: #ffb347; animation-duration: 5.8s; animation-delay: 1.2s; }
        .particle:nth-child(7) { top: 12%; left: 65%; width: 6px; height: 6px; background: #ff4d9d; animation-duration: 7.2s; animation-delay: 0.8s; }
        .particle:nth-child(8) { top: 55%; left: 95%; width: 11px; height: 11px; background: #4dffb8; animation-duration: 9s; animation-delay: 0.3s; }

        /* 底部微光扫过 */
        .scan-line {
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 280px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00f7ff, #a855f7, #ff4d9d, transparent);
            filter: blur(2px);
            animation: scan 3s infinite linear;
            opacity: 0.7;
            border-radius: 100%;
        }

        /* ========== 动画关键帧 ========== */
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes spin-reverse {
            0% { transform: rotate(360deg); }
            100% { transform: rotate(0deg); }
        }

        @keyframes pulse {
            0% { transform: scale(0.8); opacity: 0.5; }
            50% { transform: scale(1.3); opacity: 0.2; }
            100% { transform: scale(1.6); opacity: 0; }
        }

        @keyframes bounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-8px); }
        }

        @keyframes dotWave {
            0%, 100% { transform: scale(1); opacity: 0.7; }
            50% { transform: scale(1.8); opacity: 1; box-shadow: 0 0 25px currentColor; }
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); opacity: 0.5; }
            100% { transform: translate(30px, -40px) scale(1.5); opacity: 1; }
        }

        @keyframes flicker {
            0% { opacity: 0.95; text-shadow: 0 0 10px #00f7ff, 0 0 20px #a855f7; }
            50% { opacity: 1; text-shadow: 0 0 18px #ff4d9d, 0 0 35px #00f7ff, 0 0 55px #a855f7; }
            100% { opacity: 0.98; text-shadow: 0 0 12px #a855f7, 0 0 30px #ff4d9d; }
        }

        @keyframes scan {
            0% { transform: translateX(-50%) translateY(0); opacity: 0; }
            20% { opacity: 0.9; }
            80% { opacity: 0.9; }
            100% { transform: translateX(-50%) translateY(-40px); opacity: 0; }
        }

        /* 手机小屏适配 */
        @media (max-width: 480px) {
            .loader-wrapper {
                width: 260px;
                height: 260px;
            }
            .core-text .cn {
                font-size: 1.6rem;
                letter-spacing: 2px;
            }
            .orbit-ring { width: 170px; height: 170px; }
            .orbit-ring.second { width: 130px; height: 130px; }
            .orbit-ring.third { width: 90px; height: 90px; }
            .dots div { width: 10px; height: 10px; }
        }
    </style>
</head>
<body>
    <div class="loader-wrapper">
        <!-- 脉冲光环背景 -->
        <div class="pulse-ring"></div>
        <div class="pulse-ring delay"></div>

        <!-- 三个旋转的科技环 -->
        <div class="orbit-ring"></div>
        <div class="orbit-ring second"></div>
        <div class="orbit-ring third"></div>

        <!-- 中心文字与跳动点 -->
        <div class="core-text">
            <div class="cn">
                <span>加</span><span>载</span><span>中</span><span>.</span>
            </div>
            <!-- 其实上面第四个点用了符号，再用三个点更灵动，不过为了个性保留 “加 载 中 .” 然后额外加跳动点也可以，但会显得重复，所以改为文字下面的三个动态点 -->
            <div class="dots">
                <div></div>
                <div></div>
                <div></div>
            </div>
        </div>

        <!-- 漂浮的粒子（个性化元素） -->
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>

        <!-- 底部扫光 -->
        <div class="scan-line"></div>
    </div>
</body>
</html>
